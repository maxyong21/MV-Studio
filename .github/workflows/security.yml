# Every Monday: checks the live website's security settings (sign-up closed, private data closed, admin
# functions locked, browser protections on) and that no production dependency has a known high-severity
# problem. If a check fails, GitHub emails the person who last edited this schedule.
# See docs/SECURITY_CHECKS.md. To check a different address, set the repository variable SITE_URL.
name: Security check

on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the live site
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://mv-aistudio.vercel.app' }}
        run: node scripts/security-check.mjs
      - name: Check production dependencies
        run: npm audit --omit=dev --audit-level=high
